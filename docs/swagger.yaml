openapi: 3.0.0
info:
  title: GameHub API
  description: GameHub游戏社区平台API文档
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: 开发服务器
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务健康
  /auth/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功
