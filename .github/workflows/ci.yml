name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Backend Tests
      working-directory: ./backend
      run: npm test

    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm test

    - name: TypeScript Type Check (Backend)
      working-directory: ./backend
      run: npx tsc --noEmit

    - name: TypeScript Type Check (Frontend)
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Lint Backend
      working-directory: ./backend
      run: npm run lint || echo "Linting failed or not configured"

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint || echo "Linting failed or not configured"

  api-validation:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Swagger Validator
      run: |
        npm install -g swagger-cli
        npm install -g @apidevtools/swagger-cli

    - name: Validate Swagger Schema
      working-directory: ./backend
      run: |
        npx swagger-cli validate docs/swagger.yaml
        echo "✅ Swagger schema is valid"

    - name: Check Swagger Best Practices
      run: |
        # Install spectral (OpenAPI linter)
        npm install -g @stoplight/spectral-cli
        # Create minimal spectral ruleset
        cat > .spectral.yaml << 'EOF'
        extends: spectral:oas
        rules:
          info-contact: warn
          info-license: warn
          operation-tags: warn
        EOF
        npx spectral lint backend/docs/swagger.yaml --ruleset .spectral.yaml || echo "⚠️ Spectral found warnings"

  build:
    runs-on: ubuntu-latest
    needs: [test, api-validation]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Build Backend
      working-directory: ./backend
      run: npm run build

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Verify Build Output
      run: |
        echo "Backend build output:"
        ls -la backend/dist/ 2>/dev/null || echo "No backend dist directory"
        echo "Frontend build output:"
        ls -la frontend/dist/ 2>/dev/null || echo "No frontend dist directory"

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/gamehub-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/gamehub-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/gamehub-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/gamehub-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max