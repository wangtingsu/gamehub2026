pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$server_protocol $ssl_protocol';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m inactive=7d max_size=1g;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Docker 内部 DNS，避免容器重启后 nginx 缓存过期 IP
    resolver 127.0.0.11 valid=10s;

    upstream backend_ssr {
        server backend:3000;
    }

    # HTTPS 服务器
    server {
        listen 443 ssl;
        http2 on;
        server_name www.gghubs.com gghubs.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            return 301 /en;
        }

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 静态资源（长期缓存 + 不可变，由 Nginx 直接提供）
        # 先从主 assets 目录查找，再从 hydrate 构建产物查找
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri /hydrate/$uri @admin_assets;
            access_log off;
        }

        # HTML 文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # API 代理到后端
        # 上传文件代理（^~ 阻止正则 location 优先匹配）
        location ^~ /uploads/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_cache static_cache;
            proxy_cache_valid 200 302 5m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_no_cache $http_cache_control;
            proxy_cache_bypass $http_cache_control;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 管理后台 API 代理（重写 /admin-api/ → /api/ 以匹配后端路由）
        location /admin-api/ {
            proxy_pass http://admin-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # WebSocket 代理
        location /socket.io/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 动态 Sitemap 代理到后端
        location /sitemap.xml {
            proxy_pass http://backend:3000/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_cache static_cache;
            proxy_cache_valid 200 3600s;
            proxy_cache_use_stale error timeout updating;
            add_header Content-Type application/xml;
        }

        # llms.txt 代理到后端
        location /llms.txt {
            proxy_pass http://backend:3000/llms.txt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /llms-full.txt {
            proxy_pass http://backend:3000/llms-full.txt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # 管理后台前端
        set $admin_backend gamehub-admin-frontend;
        location /admin/ {
            proxy_pass http://$admin_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 管理后台静态资源回退（主前端找不到的资源去后台找）
        location @admin_assets {
            proxy_pass http://gamehub-admin-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors off;
        }

        # 301 重定向：旧 zh-CN 语言前缀 → cn（SEO 兼容和旧链接跳转）
        location ~* ^/zh-CN(?:/(.*))?$ {
            return 301 /cn/$1;
        }

        # SSR 模式优先，降级到 SPA index.html
        location / {
            try_files $uri @ssr;
        }

        location @ssr {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 504 = /index.html;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTP server (host nginx handles SSL termination)
    server {
        listen 80;
        server_name www.gghubs.com gghubs.com;

        root /usr/share/nginx/html;

        location = / {
            return 301 /en;
        }

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # 静态资源（长期缓存 + 不可变）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri /hydrate/$uri @admin_assets;
            access_log off;
        }

        # HTML 文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # API 代理到后端
        # 上传文件代理（^~ 阻止正则 location 优先匹配）
        location ^~ /uploads/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
