pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$server_protocol $ssl_protocol';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # ── HTTP → HTTPS 强制重定向 ────────────────────────────
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS + HTTP/3 (QUIC) 主服务器 ────────────────────
    server {
        # HTTP/1.1 + HTTP/2 over TCP (TLS)
        # nginx 1.25+ 需使用 http2 on; 而非 listen ... http2 参数
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # HTTP/3 over QUIC (UDP)
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ── SSL/TLS 证书 ──────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── HTTP/3 (QUIC) 优化 ────────────────────────────────
        ssl_early_data on;
        ssl_buffer_size 4k;

        # ── 注意：以下 server 级 add_header 会被子 location 中的 add_header 重置 ──
        # /、/health、静态文件等 location 需要各自添加 Alt-Svc 和安全头
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Protocol "$server_protocol" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.gamehub.example.com https://sentry.io; frame-src 'none'; object-src 'none'" always;

        # ── 静态资源（长期缓存）─────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Alt-Svc 'h3=":443"; ma=86400' always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            access_log off;
        }

        # HTML 文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Alt-Svc 'h3=":443"; ma=86400' always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        }

        # SPA fallback（SSR 路由）
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Alt-Svc 'h3=":443"; ma=86400' always;
            add_header X-Protocol "$server_protocol" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
            add_header Alt-Svc 'h3=":443"; ma=86400' always;
        }

        # 调试端点：显示连接信息
        location /debug {
            access_log off;
            default_type application/json;
            return 200 "{\n  \"protocol\": \"$server_protocol\",\n  \"ssl_protocol\": \"$ssl_protocol\",\n  \"ssl_cipher\": \"$ssl_cipher\",\n  \"server\": \"$host\",\n  \"remote_addr\": \"$remote_addr\"\n}\n";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
