# HTTP → HTTPS 301 redirect (with Let's Encrypt ACME support)
server {
    listen 80;
    listen [::]:80;
    server_name www.gghubs.com gghubs.com;

    # Let's Encrypt 验证（需要本地响应）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 301 zh-CN → cn（在重定向到HTTPS之前处理）
    location ~* ^/zh-CN(?:/(.*))?$ {
        return 301 https://www.gghubs.com/cn/$1;
    }

    # 其余全部重定向到 HTTPS + www 规范化
    location / {
        return 301 https://www.gghubs.com$request_uri;
    }
}

# non-www → www 规范化重定向（HTTPS）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gghubs.com;

    ssl_certificate /etc/letsencrypt/live/gghubs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gghubs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.gghubs.com$request_uri;
}

# 主站点 HTTPS（www 权威域名）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gghubs.com;

    ssl_certificate /etc/letsencrypt/live/gghubs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gghubs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /avatars/ {
        alias /opt/gamehub/avatars/;
        expires 30d;
        add_header Cache-Control public;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /admin-api/ {
        rewrite ^/admin-api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /llms.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /llms-full.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 301 redirect old /zh-CN/ prefix → /cn/
    location ~* ^/zh-CN(?:/(.*))?$ {
        return 301 /cn/$1;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

