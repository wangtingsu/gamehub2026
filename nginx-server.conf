server_tokens off;

# HTTP → HTTPS 301 redirect (with Let's Encrypt ACME support)
server {
    listen 80;
    listen [::]:80;
    server_name www.gghubs.com gghubs.com;

    # Let's Encrypt 验证（需要本地响应）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 301 zh-CN → cn（在重定向到HTTPS之前处理）
    location ~* ^/zh-CN(?:/(.*))?$ {
        return 301 https://www.gghubs.com/cn/$1;
    }

    # 其余全部重定向到 HTTPS + www 规范化
    location / {
        return 301 https://www.gghubs.com$request_uri;
    }
}

# non-www → www 规范化重定向（HTTPS）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gghubs.com;

    ssl_certificate /etc/letsencrypt/live/gghubs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gghubs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://www.gghubs.com$request_uri;
}

# 主站点 HTTPS（www 权威域名）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gghubs.com;

    ssl_certificate /etc/letsencrypt/live/gghubs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gghubs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 旧 ASP 首页 301 重定向到英文首页（/cn/index.asp 此前被脚本后缀规则返回 404）
    location = /cn/index.asp {
        return 301 /en;
    }

    # 阻断扫描器探测的服务器脚本后缀（本站为 Node/React，无这些后端脚本）
    location ~* \.(asp|aspx|php|phtml|php3|php4|php5|jsp|jspx|cgi|pl|cfm|ashx|asmx)$ {
        return 404;
    }

    location /avatars/ {
        alias /opt/gamehub/avatars/;
        expires 30d;
        add_header Cache-Control public;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /admin-api/ {

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /llms.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /llms-full.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin 静态资源直连 admin 容器
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 301 redirect old /zh-CN/ prefix → /cn/
    location ~* ^/zh-CN(?:/(.*))?$ {
        return 301 /cn/$1;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

