openapi: 3.0.3
info:
  title: GameHub API
  description: GameHub游戏社区平台API文档
  version: 1.0.0
  contact:
    name: GameHub开发团队
    email: dev@gamehub.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: 本地开发服务器
  - url: https://api.gamehub.example.com/api/v1
    description: 生产服务器

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 用户
    description: 用户管理接口
  - name: 游戏
    description: 游戏管理接口
  - name: 新闻
    description: 新闻文章接口
  - name: 评测
    description: 游戏评测接口
  - name: 社区
    description: 社区帖子接口
  - name: 系统
    description: 系统健康检查接口
  - name: 文件上传
    description: 文件上传相关接口
  - name: 邮件服务
    description: 邮件发送和模板管理接口
  - name: 收藏管理
    description: 用户收藏游戏管理接口
  - name: 关注
    description: 用户关注管理接口
  - name: 点赞
    description: 内容点赞接口
  - name: 通知
    description: 用户通知管理接口
  - name: 评论
    description: 评论管理接口
  - name: 搜索
    description: 全局搜索接口
  - name: 游戏库
    description: 用户游戏库管理接口
  - name: 管理
    description: 管理员后台接口
  - name: 关于
    description: 关于页面内容接口
  - name: 双因素认证
    description: 双因素认证相关接口
  - name: OAuth
    description: OAuth第三方登录相关接口
  - name: 短信服务
    description: 短信验证码相关接口
  - name: 发现
    description: 内容发现和推荐接口
  - name: 游戏化
    description: 用户经验值和积分系统接口
  - name: 成就
    description: 成就系统接口
  - name: 消息
    description: 用户消息和会话接口
  - name: 攻略
    description: 游戏攻略指南接口
  - name: AI
    description: AI助手相关接口
  - name: 3D打印
    description: 3D打印服务接口
  - name: 站点地图
    description: 站点地图和SEO接口
  - name: 管理员-分析
    description: 管理员数据分析接口
  - name: 管理员-用户画像
    description: 管理员用户画像标签接口
  - name: 管理员-部署
    description: 管理员部署管理接口
  - name: 管理员-备份
    description: 管理员备份恢复接口
  - name: 管理员-分类
    description: 管理员分类管理接口
  - name: 管理员-模板
    description: 管理员评测模板接口
  - name: 管理员-攻略
    description: 管理员攻略管理接口

paths:
  /auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 创建新用户账户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 用户登录获取访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新访问令牌
      description: 使用刷新令牌获取新的访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 刷新令牌
      responses:
        '200':
          description: 令牌刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: 令牌无效或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      description: 用户登出，使令牌失效
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags:
        - 认证
      summary: 修改密码
      description: 修改当前登录用户的密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  description: 当前密码
                  example: "oldpassword123"
                newPassword:
                  type: string
                  description: 新密码
                  minLength: 6
                  example: "newpassword456"
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 请求参数错误或密码验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags:
        - 认证
      summary: 忘记密码
      description: 发送密码重置邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
      responses:
        '200':
          description: 如果邮箱存在，重置链接已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags:
        - 认证
      summary: 重置密码
      description: 使用重置令牌重置密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                  description: 密码重置令牌
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                newPassword:
                  type: string
                  description: 新密码
                  minLength: 6
                  example: "newpassword456"
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 请求参数错误或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email/{token}:
    get:
      tags:
        - 认证
      summary: 验证邮箱
      description: 使用验证令牌验证用户邮箱
      parameters:
        - name: token
          in: path
          required: true
          description: 邮箱验证令牌
          schema:
            type: string
      responses:
        '200':
          description: 邮箱验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 令牌无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/health:
    get:
      tags:
        - 认证
      summary: 认证服务健康检查
      description: 检查认证服务健康状态
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                        example: "auth"
                      status:
                        type: string
                        example: "healthy"
                      timestamp:
                        type: string
                        format: date-time
                        example: "2026-04-21T10:00:00Z"
                  message:
                    type: string
                    example: "认证服务运行正常"

  /auth/me:
    get:
      tags:
        - 认证
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - 认证
      summary: 更新用户信息
      description: 更新当前登录用户的信息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login/phone:
    post:
      tags:
        - 认证
      summary: 手机号登录
      description: 使用手机号和验证码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
                code:
                  type: string
                  description: 短信验证码
                  example: "123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register/phone:
    post:
      tags:
        - 认证
      summary: 手机号注册
      description: 使用手机号和验证码注册新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
                - username
                - password
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
                code:
                  type: string
                  description: 短信验证码
                  example: "123456"
                username:
                  type: string
                  description: 用户名
                  example: "new_user"
                password:
                  type: string
                  description: 密码
                  minLength: 6
                  example: "password123"
                displayName:
                  type: string
                  description: 显示名称
                  example: "新用户"
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/oauth/providers:
    get:
      tags:
        - OAuth
      summary: 获取OAuth提供商列表
      description: 获取支持的第三方登录提供商列表
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "google"
                            name:
                              type: string
                              example: "Google"
                            icon:
                              type: string
                              example: "google-circle"
                            enabled:
                              type: boolean
                              example: true

  /auth/oauth/url/{provider}:
    get:
      tags:
        - OAuth
      summary: 获取OAuth授权URL
      description: 获取指定提供商的OAuth授权跳转链接
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth提供商名称
          schema:
            type: string
            enum: [google, facebook, twitter, github, discord]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        example: "https://accounts.google.com/o/oauth2/auth?..."

  /auth/oauth/{provider}/callback:
    get:
      tags:
        - OAuth
      summary: OAuth回调处理
      description: 处理OAuth登录回调
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth提供商名称
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: 授权码
          schema:
            type: string
        - name: state
          in: query
          description: 状态码（用于CSRF保护）
          schema:
            type: string
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/two-factor/status:
    get:
      tags:
        - 双因素认证
      summary: 获取2FA状态
      description: 获取当前用户的双因素认证状态
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        example: false
                      method:
                        type: string
                        example: "authenticator"
                      lastUsedAt:
                        type: string
                        format: date-time

  /auth/two-factor/setup:
    post:
      tags:
        - 双因素认证
      summary: 获取2FA设置信息
      description: 获取双因素认证设置信息（密钥和二维码）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        example: "JBSWY3DPEHPK3PXP"
                      qrCodeUrl:
                        type: string
                        format: uri
                        example: "https://api.qrserver.com/v1/create-qr-code/?data=otpauth://..."
                      backupCodes:
                        type: array
                        items:
                          type: string
                        example: ["1234-5678", "8765-4321", "1122-3344"]

  /auth/two-factor/enable:
    post:
      tags:
        - 双因素认证
      summary: 启用2FA
      description: 验证并启用双因素认证
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 验证码
                  example: "123456"
      responses:
        '200':
          description: 启用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/two-factor/disable:
    post:
      tags:
        - 双因素认证
      summary: 禁用2FA
      description: 禁用双因素认证
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: 当前密码验证
                  example: "password123"
      responses:
        '200':
          description: 禁用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 密码验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/two-factor/verify:
    post:
      tags:
        - 双因素认证
      summary: 验证2FA
      description: 登录时验证双因素认证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partialAuthToken
                - code
              properties:
                partialAuthToken:
                  type: string
                  description: 部分认证令牌（登录时获取）
                  example: "eyJhbGciOiJIUzI1NiIs..."
                code:
                  type: string
                  description: 验证码
                  example: "123456"
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sms/send:
    post:
      tags:
        - 短信服务
      summary: 发送短信验证码
      description: 发送短信验证码到指定手机号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          description: 发送过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sms/verify:
    post:
      tags:
        - 短信服务
      summary: 验证短信验证码
      description: 验证手机号和短信验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
                code:
                  type: string
                  description: 验证码
                  example: "123456"
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags:
        - 用户
      summary: 获取用户列表（管理员）
      description: 获取所有用户列表，仅管理员可访问
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 每页数量
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: 搜索关键词（用户名或邮箱）
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      tags:
        - 用户
      summary: 获取用户详情
      description: 根据ID获取用户详情
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - 用户
      summary: 更新用户信息（管理员）
      description: 更新用户信息，仅管理员可访问
      security:
        - bearerAuth: []
      parameters:
